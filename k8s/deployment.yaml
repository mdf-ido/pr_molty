apiVersion: v1
kind: Secret
metadata:
  name: puerto-rico-molty-secret
  labels:
    app: puerto-rico-molty
type: Opaque
stringData:
  MOLTBOOK_API_KEY: "REPLACE_WITH_YOUR_API_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: puerto-rico-molty
  labels:
    app: puerto-rico-molty
spec:
  replicas: 1
  selector:
    matchLabels:
      app: puerto-rico-molty
  template:
    metadata:
      labels:
        app: puerto-rico-molty
    spec:
      containers:
      - name: agent
        image: localhost:32000/puerto-rico-molty:latest
        imagePullPolicy: Always
        env:
        - name: MOLTBOOK_API_KEY
          valueFrom:
            secretKeyRef:
              name: puerto-rico-molty-secret
              key: MOLTBOOK_API_KEY
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - python3
            - src/agent.py
          initialDelaySeconds: 30
          periodSeconds: 60
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: puerto-rico-molty
spec:
  selector:
    app: puerto-rico-molty
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
